name: CI

# Se lance à chaque push, sur toutes les branches. Le résultat apparaît aussi sur la PR de la branche.
on:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  locales:
    name: Clés de traduction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check:locales

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Vitest sur PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Le badge est publié sur la branche badges.
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wishlist_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Écrire le rapport de couverture
        run: node scripts/coverage-report.mjs
      - name: Garder le rapport détaillé
        uses: actions/upload-artifact@v7
        with:
          name: rapport-couverture
          path: coverage
          retention-days: 14
      - name: Publier le badge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-badge.sh

  build:
    name: Build, routes et redémarrage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wishlist_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Construire le paquet Lambda
        run: npm run build:lambda
      - name: Créer la table et appliquer les migrations
        run: |
          psql "$DATABASE_URL" -f db/init.sql
          npm run migrate
      - name: Appeler les routes et redémarrer l'API
        run: bash scripts/verifier-routes.sh

  e2e:
    name: Tests e2e (Nuxt, Hono et PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wishlist_test
    steps:
      # Les deux projets sont rangés côte à côte, comme sur ton ordinateur.
      - uses: actions/checkout@v7
        with:
          path: IIMTest-API
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/IIMTest-Inte
          path: Inte
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Inte/package-lock.json
            IIMTest-API/package-lock.json
      - run: npm ci
        working-directory: IIMTest-API
      - run: npm ci
        working-directory: Inte
      - name: Créer la table et appliquer les migrations
        run: |
          psql "$TEST_DATABASE_URL" -f db/init.sql
          npm run migrate
        working-directory: IIMTest-API
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium
        working-directory: Inte
      - run: npm run test:e2e
        working-directory: Inte
      - name: Garder les traces des tests ratés
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-e2e
          path: Inte/test-results
          retention-days: 7

  audit:
    name: Audit de sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Migrations et déploiement Lambda
    # Un merge sur main ne part en ligne que si tous les contrôles sont verts.
    needs: [lint, prettier, locales, typecheck, test, build, e2e, audit]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Permet à GitHub de prouver son identité à AWS, sans clé d'accès à stocker.
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LAMBDA_FUNCTION: pokewishlist-api
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Signaler si les secrets manquent
        if: env.AWS_ROLE_ARN == '' || env.DATABASE_URL == ''
        run: echo "Secrets absents, deploiement ignore."
      - uses: actions/checkout@v7
        if: env.AWS_ROLE_ARN != '' && env.DATABASE_URL != ''
      - uses: actions/setup-node@v7
        if: env.AWS_ROLE_ARN != '' && env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm
      - if: env.AWS_ROLE_ARN != '' && env.DATABASE_URL != ''
        run: npm ci
      # Les migrations passent avant le code : la nouvelle Lambda trouve toujours ses colonnes.
      - name: Appliquer les migrations
        if: env.AWS_ROLE_ARN != '' && env.DATABASE_URL != ''
        run: npm run migrate
      - name: Construire le paquet Lambda
        if: env.AWS_ROLE_ARN != '' && env.DATABASE_URL != ''
        run: |
          npm run build:lambda
          cd dist-lambda
          zip ../lambda.zip index.js
      - name: Se connecter à AWS
        if: env.AWS_ROLE_ARN != '' && env.DATABASE_URL != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Mettre à jour la Lambda
        if: env.AWS_ROLE_ARN != '' && env.DATABASE_URL != ''
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" --zip-file fileb://lambda.zip --output text --query LastUpdateStatus
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"
      # Si une URL critique ne répond pas, la CD passe au rouge.
      - name: Contrôler l'API en ligne
        if: env.AWS_ROLE_ARN != '' && env.DATABASE_URL != '' && env.API_URL != ''
        run: bash scripts/smoke-api.sh
